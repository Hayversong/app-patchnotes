name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchnotes
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: patchnotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchnotes -d patchnotes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Credenciais descartáveis do container de CI; não são segredos.
      TEST_DATABASE_URL: postgresql+asyncpg://patchnotes:ci-somente-teste@127.0.0.1:5432/patchnotes_test
      DATABASE_URL: postgresql+asyncpg://patchnotes:ci-somente-teste@127.0.0.1:5432/patchnotes_test
      JWT_SECRET: segredo-da-ci-apenas-para-alembic-check-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q
      - name: Migrations em dia com os modelos
        run: python -m alembic upgrade head && python -m alembic check

  frontend:
    name: Frontend (lint + tipos + mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci --no-audit --no-fund
      - run: npx next lint
      - run: npx tsc --noEmit -p .
      - name: Testes dos handlers MSW
        run: bun test src/mocks
