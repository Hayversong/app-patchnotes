name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchnotes
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: patchnotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchnotes -d patchnotes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Credenciais descartáveis do container de CI; não são segredos.
      TEST_DATABASE_URL: postgresql+asyncpg://patchnotes:ci-somente-teste@127.0.0.1:5432/patchnotes_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql+asyncpg://patchnotes:ci-somente-teste@127.0.0.1:5432/patchnotes_test
      JWT_SECRET: segredo-da-ci-apenas-para-alembic-check-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q
      - name: Migrations em dia com os modelos
        run: python -m alembic upgrade head && python -m alembic check

  frontend:
    name: Frontend (lint + tipos + unitários + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx next lint
      - run: npx tsc --noEmit -p .
      - run: npm run test:greeting
      - name: Testes unitários (Vitest)
        run: npm test
      - name: Build de produção
        run: npm run build

  e2e:
    name: Ponta a ponta (Playwright, Chromium + Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchnotes
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: patchnotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchnotes -d patchnotes"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Credenciais descartáveis do container de CI; não são segredos.
      DATABASE_URL: postgresql+asyncpg://patchnotes:ci-somente-teste@127.0.0.1:5432/patchnotes
      JWT_SECRET: segredo-da-ci-apenas-para-o-e2e-0123456789abcdef
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://localhost:3000
      OLLAMA_URL: http://127.0.0.1:11434
      # Cadastros de teste passam do limite de 10/h por IP; os limites têm testes próprios no pytest.
      RATE_LIMIT_ENABLED: "false"
      API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_CHAT_WS_URL: ws://localhost:8000/ws/chat
      E2E_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Ollama falso
        run: node e2e/fake-ollama.mjs &
      - name: API
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Frontend
        run: |
          npm run build
          npm start > web.log 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/login && break; sleep 1; done
      - run: npx playwright test
      - if: failure()
        run: tail -n 100 api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
