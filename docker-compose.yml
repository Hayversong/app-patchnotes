# Ambiente completo do Patchnotes: proxy (nginx), frontend, API, PostgreSQL, Redis, Ollama (LLM) e Mailpit.
#
#   cp .env.example .env      # ajuste JWT_SECRET e a senha do banco
#   docker compose up --build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build   # com GPU NVIDIA
#
# Aplicação: http://localhost:3000 (nginx: site, /api, /ws e /docs no mesmo endereço)
# Swagger: http://localhost:3000/docs (ou direto na API: http://localhost:8000/docs) · E-mails: http://localhost:8025
# Na primeira subida o serviço ollama-pull baixa o modelo (~2 GB); o chat responde depois que ele terminar.
# Portas presas a 127.0.0.1. Não rode junto com backend/docker-compose.yml (mesmas portas).
name: patchnotes-stack

# Rede com endereço fixo para o proxy: a API só confia no X-Forwarded-For vindo dele (TRUSTED_PROXIES).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.57.0/24

# Containers da aplicação sem escalada de privilégio e sem capacidades de kernel (não precisam de nenhuma).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-patchnotes}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
  POSTGRES_DB: ${POSTGRES_DB:-patchnotes}

services:
  postgres:
    image: postgres:17-alpine
    environment: *db-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Baixa o modelo uma vez (fica no volume ollama-models) e encerra.
  ollama-pull:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *hardening
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-patchnotes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-patchnotes}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      # Só o nginx (endereço fixo abaixo). Nunca o frontend: o rewrite do Next repassa o cabeçalho do cliente.
      TRUSTED_PROXIES: 172.30.57.10
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      # Acesso direto à API (Swagger, testes). O navegador usa o proxy em localhost:3000.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    <<: *hardening
    build:
      context: .
      args:
        API_URL: http://backend:8000
        # Mesmo endereço da página: o nginx encaminha /ws/ para a API.
        NEXT_PUBLIC_CHAT_WS_URL: /ws/chat
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginx:1.30-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
    networks:
      default:
        ipv4_address: 172.30.57.10
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  ollama-models:
