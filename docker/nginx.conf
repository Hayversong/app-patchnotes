# Porta de entrada do ambiente Docker. Tudo no mesmo endereço (http://localhost:3000):
#   /api/*, /docs, /openapi.json → API · /ws/* → WebSocket da API · resto → frontend Next.js
# O X-Forwarded-For é SOBRESCRITO com o IP de quem conectou aqui: um valor forjado pelo cliente não passa,
# e a API confia neste proxy (TRUSTED_PROXIES) para saber o IP real nos limites de requisição.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream api {
  server backend:8000;
}

upstream web {
  server frontend:3000;
}

server {
  listen 80;
  server_tokens off;
  client_max_body_size 64k;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://api;
  }

  location = /docs {
    proxy_pass http://api;
  }

  location = /openapi.json {
    proxy_pass http://api;
  }

  location /ws/ {
    proxy_pass http://api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Respostas longas do modelo: sem tempo limite curto entre mensagens (a API fecha por inatividade).
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
  }

  location / {
    proxy_pass http://web;
  }
}
